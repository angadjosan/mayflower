name: CI
on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Applies supabase/migrations/*.sql (idempotent) when SUPABASE_DB_URL is set as a repo secret.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "SUPABASE_DB_URL not set — skipping"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in supabase/migrations/*.sql; do echo "→ $f"; psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
